name: Auto-Deploy Backend to Azure

on:
  push:
    branches:
      - Ashan
    paths:
      - 'backend/**'
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  ACR_NAME: "fypsinhalaavatarregistry26v2"
  APP_NAME: "fyp-sinhala-avatar-backend-v2"
  IMAGE_TAG: "backend:latest"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !backend/documents_unicode/
          sparse-checkout-cone-mode: false

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v2
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          cd backend
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_TAG }} .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_TAG }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_TAG }}
