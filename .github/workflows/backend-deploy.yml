name: Deploy Backend to DigitalOcean

on:
  push:
    branches:
      - production
    paths:
      - 'backend/**'
      - 'docker-compose.backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /root/Sinhala-Teaching-AI-AVATAR
            git config core.sparseCheckout true
            echo "/*" > .git/info/sparse-checkout
            echo "!backend/documents_unicode/" >> .git/info/sparse-checkout
            git fetch origin
            git reset --hard origin/production
            curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
            chmod +x /usr/local/bin/docker-compose
            /usr/local/bin/docker-compose -f docker-compose.backend.yml down
            /usr/local/bin/docker-compose -f docker-compose.backend.yml up -d --build
