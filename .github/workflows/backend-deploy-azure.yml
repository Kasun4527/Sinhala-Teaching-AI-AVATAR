name: Deploy Backend to Azure Container Apps

on:
  push:
    branches:
      - new_production
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy-azure.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/backend/documents_unicode/
            !/backend/chroma_db/
            !/backend/images/
          sparse-checkout-cone-mode: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (ACR Tasks is blocked on trial subscriptions, so build here instead)
        run: |
          az acr login -n ${{ secrets.AZURE_ACR_NAME }}
          IMAGE=${{ secrets.AZURE_ACR_NAME }}.azurecr.io/ai-avatar-backend
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./backend
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Update Container App
        run: |
          az containerapp update \
            -n ai-avatar-backend \
            -g ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/ai-avatar-backend:${{ github.sha }}
