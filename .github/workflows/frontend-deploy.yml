name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - new_production
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
          sparse-checkout: 'frontend'
          
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend" # Path to your Next.js code
          api_location: ""
          output_location: "" # Leave empty for Next.js hybrid apps
        env:
          # NEXT_PUBLIC_* vars are baked into the client bundle at build time,
          # so they must be set here (not as a Portal Application Setting,
          # which only applies at runtime).
          NEXT_PUBLIC_BACKEND_URL: http://178.128.97.27:8000
          NEXT_PUBLIC_ENGAGEMENT_URL: http://159.223.91.232:5000
